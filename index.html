<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ербақыттың сайты</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        header {
            padding: 60px 20px;
        }

        h1 {
            font-size: 38px;
        }

        p {
            font-size: 20px;
        }

        .author {
            margin-top: 50px;
            color: #aaa;
            font-size: 16px;
        }

        button {
            padding: 14px 25px;
            border: none;
            border-radius: 10px;
            font-size: 17px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Менің алғашқы сайтым 🚀</h1>

        <p>Бұл сайтты мен телефон арқылы жасадым!</p>

        <button onclick="showMessage()">
            Басу
        </button>

        <div class="author">
            Ербақыт жасаған ❤️
        </div>
    </header>

    <script>
        function showMessage() {
            alert("Сайт жұмыс істеп тұр! 🔥");
        }
    </script>

</body>
</html>
